version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:24.11.1-browsers
    steps:
      - checkout
      - run:
          name: Install dependencies (Yarn 4 via corepack)
          command: |
            corepack enable || sudo corepack enable
            yarn install --immutable
      - run: # run tests
          name: Run Tests and Coverage
          command: node ./node_modules/react-scripts/scripts/test.js --coverage --watchAll=false --maxWorkers=2
